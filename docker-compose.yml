services:
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      - VITE_API_URL=http://localhost:8080/api/v1

  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      - NISA_JWT_SECRET=local-development-secret-change-before-public
      - NISA_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5175,http://localhost:5175
